<style>

/* Reset sizing */
*, *::before, *::after {
  box-sizing: border-box;
}

/* Variables theme clair */
:root {
  --bg: var(--alice-panel-soft-light);
  --card-bg: var(--alice-panel-soft-light);

  /* Texte */
  --text: #3c3732;
  --muted: var(--alice-muted-light);

  /* Pills */
  --pill-bg: #eaf4fb;
  --pill-text: #264fc4;

  /* SAT */
  --sat-bg: #f6e4b5;
  --sat-text: #de511d;

  /* Hors patrimoine */
  --hp-bg: rgba(200, 14, 14, 0.12);
  --hp-text: #c80e0e;

  /* Accent / bordure / ombre */
  --accent: #5068f5;
  --border: #b0cc93;
  --shadow: rgba(0, 0, 0, 0.1);
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--alice-bg-page-deep-dark);
    --card-bg: rgba(10, 18, 31, 0.92);

    --text: var(--alice-text-dark);
    --muted: var(--alice-muted-dark);

    --pill-bg: rgba(96, 165, 250, 0.14);
    --pill-text: #8fc2ff;

    --sat-bg: rgba(251, 191, 36, 0.14);
    --sat-text: #ffd38a;

    --hp-bg: rgba(248, 113, 113, 0.14);
    --hp-text: #fca5a5;

    --accent: #60a5fa;
    --border: var(--alice-line-strong-dark);
    --shadow: rgba(0, 0, 0, 0.35);
  }

  .board-header {
    background: rgba(10, 18, 31, 0.96);
    border: 1px solid var(--border);
  }

  .type-pill {
    background: rgba(148, 163, 184, 0.12);
    color: var(--text);
    border-color: var(--border);
  }

  .ville-card {
    background: rgba(148, 163, 184, 0.06) !important;
    border: 1px solid var(--border);
  }

  .board-close {
    background: rgba(148, 163, 184, 0.14);
    color: var(--text);
  }

  .board-close:hover,
  .board-close:focus-visible {
    background: rgba(148, 163, 184, 0.24);
  }

}

/* Header */
.board-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.board-main-row {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-right: 34px;
}

.board-close {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  border: 0;
  background: #e5e7eb;
  color: #111827;
  text-decoration: none;
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
}

.board-close:hover {
  background: #d1d5db;
}

.board-close:focus-visible {
  background: #d1d5db;
  outline: none;
}

.board-title {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0.2px;
}

.board-row {
  flex: 1 1 420px;
  min-width: 180px;
}

.board-logo {
  height: 28px;
  width: auto;
  display: block;
}

.board-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}

#counters {
  opacity: 0.9;
}

/* Layout */
body {
  font-family: Inter, sans-serif;
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
}

@media (prefers-color-scheme: dark) {
  body {
    background: var(--alice-page-glow-dark), var(--bg);
  }
}

.board-row {
  margin-top: 0;
}

/* Liens cliquables */
.section-title,
.sat-pill {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: 0.15s;
}

/* Pills */
.pill,
.sat-pill,
.section-title,
.type-pill {
  display: inline-block;
}

.pill {
  padding: 4px 8px;
  background: var(--pill-bg);
  color: var(--pill-text);
  border-radius: 10px;
  font-size: 12px;
  margin: 4px 6px 4px 0;
  cursor: pointer;
  transition: 0.15s;
  text-decoration: none;
}

.pill:hover,
.sat-pill:hover,
.section-title:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 3px 10px var(--shadow);
}

.type-pill {
  background: #e6ecef;
  color: #3c3732;
  border: 1px solid #b0cc93;
  padding: 3px 10px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin-left: 6px;
}

.sat-pill,
.section-title {
  background: var(--sat-bg);
  color: var(--sat-text);
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 10px;
  font-weight: 600;
  margin-bottom: 8px;
}

.hp .pill {
  background: var(--hp-bg);
  color: var(--hp-text);
}

/* Cartes / grille */
.post-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.card {
  background: var(--card-bg);
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 4px 12px var(--shadow);
  border: 1px solid rgba(255, 255, 255, 0.05);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.45s ease forwards;
}

.card.hp-poste{
  background: linear-gradient(135deg, #fff1f1, #ffe4e4);
  border: 1px solid #ef9a9a;
  box-shadow: 0 6px 16px rgba(200, 14, 14, 0.18);
}

@media (prefers-color-scheme: dark){
  .card.hp-poste{
    background: linear-gradient(135deg, rgba(120,20,20,0.45), rgba(80,10,10,0.35));
    border: 1px solid rgba(255,138,138,0.55);
    box-shadow: 0 6px 18px rgba(255, 80, 80, 0.18);
  }
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 8px;
}

.rail-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.25;
}

.rail-meta-sat {
  margin: -2px 0 8px;
}

.rail-code {
  flex: 0 0 auto;
  border-radius: 999px;
  padding: 2px 6px;
  font-size: 10px;
  font-weight: 700;
}

.rail-code {
  background: rgba(80, 104, 245, 0.11);
  color: var(--accent);
}

.rail-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-tooltip {
  position: fixed;
  z-index: 2000;
  max-width: min(360px, calc(100vw - 24px));
  padding: 8px 10px;
  border: 1px solid rgba(60, 55, 50, 0.18);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.96);
  color: var(--text);
  box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
  font-size: 12px;
  line-height: 1.35;
  pointer-events: none;
}

.app-tooltip[hidden] {
  display: none;
}

.app-tooltip-status {
  color: var(--muted);
}

@media (prefers-color-scheme: dark) {
  .app-tooltip {
    background: rgba(17, 24, 39, 0.96);
    border-color: rgba(148, 163, 184, 0.35);
  }
}

.sat-block {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Recherche */
#search {
  width: 100%;
  padding: 12px 18px;
  font-size: 15px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
}

#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(80, 104, 245, 0.18);
}

/* Filtres */
.filters {
  position: sticky;
  top: var(--board-header-sticky-offset, 0px);
  z-index: 49;
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  padding: 10px 8px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(10px);
}

.filters button {
  padding: 8px 16px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--border);
  cursor: pointer;
  font-weight: 600;
  color: var(--text);
  transition: all 0.15s ease;
  backdrop-filter: blur(6px);
}

.filters button:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}

.filters button.activeFilter {
  background: linear-gradient(135deg, #5b6eff, #5068f5);
  color: #ffffff;
  border-color: #5068f5;
  box-shadow: 0 6px 18px rgba(80, 104, 245, 0.35);
}

.pill:focus-visible,
.sat-pill:focus-visible,
.section-title:focus-visible,
.filters button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Header container */
.board-header {
  position: sticky;
  top: 0;
  z-index: 50;
  margin-bottom: 16px;
  padding: 14px;
  border-radius: 18px;
  backdrop-filter: blur(8px);
  box-shadow: 0 10px 26px var(--shadow);
}

@media (prefers-color-scheme: dark) {

  #search,
  .filters button,
  .card {
    border-color: var(--border);
  }

  #search {
    background: rgba(148, 163, 184, 0.08);
  }

  .filters button {
    background: rgba(148, 163, 184, 0.12);
  }

}

/* Mobile */
@media (max-width: 480px) {
  .board-main-row {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
  }

  .board-row {
    flex-basis: auto;
  }

  .card {
    padding: 14px;
    border-radius: 14px;
  }

  .card-title {
    font-size: 16px;
  }

  .pill {
    font-size: 12px;
    padding: 4px 8px;
  }

  .sat-pill,
  .section-title {
    font-size: 12px;
    padding: 4px 10px;
  }
}

/* Desktop compact: densite proche de l'ancienne capture */
@media (min-width: 1200px) {
  .post-container {
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    padding: 12px;
  }

  .card-title {
    font-size: 15px;
    margin-bottom: 7px;
  }

  .pill,
  .sat-pill,
  .section-title {
    font-size: 11px;
  }

  .type-pill {
    font-size: 10px;
  }
}

</style>

<body>
<div class="board-header">
  <a class="board-close" href="index.html" aria-label="Fermer le tableau blanc et revenir à la page principale" title="Fermer">×</a>
  <div class="board-title-wrap">
    <div class="board-main-row">
      <div class="board-title">
        <img src="/ALICE/alice.webp" alt="Logo ALICE" class="board-logo">
        <span>Tableau blanc</span>
      </div>
      <div class="board-row">
        <input id="search" type="text" placeholder="Rechercher..." aria-label="Rechercher un poste, SAT ou appareil" autocomplete="off">
      </div>
    </div>

    <div class="board-meta">
      <span id="counters">Chargement…</span>
    </div>
  </div>
</div>

<div class="filters">
      <button type="button" data-tableau-tri-critere="alphabet" aria-pressed="true">A → Z</button>
      <button type="button" data-tableau-tri-critere="appareils" aria-pressed="false">+ appareils</button>
</div>

<div id="postesZone" class="post-container"></div>

</body>
